name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar tags como v1.0.1, v1.0.2, etc.
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Inject Version from Tag into App and Android
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$TAG" = "master" ] || [ "$TAG" = "main" ]; then
            VERSION="1.0.1"
          fi
          BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
          node scripts/inject-version.js "$VERSION" "$BUILD_NUM"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --no-install

      - name: Inject Keystore & Signing Config into Gradle
        run: node scripts/configure-android-signing.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-assets/rm-frotas.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-assets/rm-frotas.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/rm-frotas.apk
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rm-frotas-apk
          path: release-assets/rm-frotas.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/rm-frotas.apk
          generate_release_notes: true
          draft: false
          prerelease: false
